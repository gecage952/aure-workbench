[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-workbench"
version = "0.2.1"
description = "Project workbench for neutron reflectometry analysis at SNS REF_L (BL-4B)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Mat Doucet", email = "doucetm@ornl.gov" }]
keywords = [
  "neutron",
  "reflectometry",
  "refl1d",
  "time-resolved",
  "provenance",
  "agent-skills",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

# Core dependencies. Deliberately fat: `pip install nr-workbench` into a fresh
# venv must give a scientist a working REF_L analysis environment.
#
# `bumps` and `periodictable` are declared explicitly even though refl1d pulls
# them in -- we import them directly, and an undeclared transitive dependency
# is a trap.
#
# AuRE is pinned by SHA, not tag or version. Through v0.1.x every build
# reported version "0.1.0" regardless of the commit, and v0.1.0/v0.1.1 pointed
# at the same commit, so pip's resolver could not tell them apart. v1.0.0
# finally reports a real number, but the pin stays a SHA because main moves
# between releases and we track it. Because this is a PEP 508 direct
# reference, nr-workbench is install-from-git, not PyPI -- and it will stay
# that way: the PyPI name `aure` is taken by an unrelated project, so there is
# no version of this that ends in `pip install nr-workbench`. See
# docs/ground_truths.md.
#
# Currently 487a31d, which is the v1.0.2 release (reports 1.0.2). A SHA
# rather than the tag, for the reason above -- main moves between releases
# and we track it, so a tag would only be accurate until the next commit.
# Moved from d6e38e4 on 2026-09-21 because
# AuRE now READS `_autoreduction.dat` ITSELF. Until this bump, nrw and AuRE
# disagreed about the same files: nrw's `PARTIAL_RE` matches both reduction
# dialects, so `nrw sample scan` called them per-angle segments, while AuRE saw
# no instrument claiming them and read each as a complete curve with dQ as FWHM
# and no incident angle -- a 2.355x resolution error on a file whose header
# says `sigma`, plus the loss of every per-angle nuisance parameter. That
# mismatch is why IPTS-37740 was fitted through hand-written model specs
# instead of `nrw aure run`.
#
# The bump also brings: `theta` / `dq_is_fwhm` declarable per file in a setup
# (the escape hatch for a format AuRE does not read yet), `aure formats` for
# asking what it does read, and REF_L split into `REF_L_v1` / `REF_L_v2` with
# the old names kept as aliases. See AuRE's docs/plan-new-reduction-format.md.
#
# Advanced to 487a31d for `aure --version`, which had reported 0.1.0 since
# 0.1 because `cli.py` carried the number as a literal. That is the bug
# `provenance/env.py` works around by recording the commit instead, and it
# is why that workaround stays: the version is now truthful, but a SHA on
# main still identifies a build and a version string still does not.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pydantic>=2.4",
  "click>=8.1",
  "jinja2>=3.1",
  "flask>=3.0",
  # Explicit although Flask brings it: 3.0.3 is where the debugger gained its
  # own trusted-host check (CVE-2024-34069). `nrw serve --debug` enables that
  # debugger, and the server now accepts writes from the experiment page.
  "werkzeug>=3.0.3",
  "markdown-it-py>=3.0",
  # The experiment catalog (`experiment/*.parquet`) -- runs grouped into
  # samples, and the context that renders each sample.md. Parquet because a
  # production deployment may serve the same tables from the facility's data
  # lakehouse, whose data-assembler writer uses this schema family. The floor
  # is the fix for CVE-2023-47248 (arbitrary code execution on reading an
  # untrusted file). Imported inside functions only: ~0.9 s, and `nrw --help`
  # must stay instant -- tests/test_cli.py enforces it.
  "pyarrow>=14.0.1",
  # Its parser (`dotenv.parser`, `dotenv.variables`) edits the project's .env
  # and replays loading for the Settings page: not its documented API, so a
  # major version is not taken unread. tests/test_llm_settings.py pins what
  # nrw relies on.
  "python-dotenv>=1.0,<2",
  "refl1d>=1.0,<2",
  "bumps>=1.0,<2",
  "periodictable>=2.0",
  "aure @ git+https://github.com/neutrons-ai/aure.git@487a31dcc3d3c65580b6c6c880c1c47a195055a0",
  "authlib>=1.9.1",
  "ldap3>=2.9.1",
]

[project.optional-dependencies]
nexus = ["h5py>=3.9"]
# The ISAAC schema mapping lives upstream: data-assembler produces neutral
# typed records, nr-isaac-format maps them and talks to the Portal. Both are
# git references, so this extra cannot go to PyPI -- which nr-workbench cannot
# anyway while `aure` is pinned the same way.
isaac = [
  "nr-isaac-format @ git+https://github.com/isaac-neutrons/nr-isaac-format.git",
  "data-assembler @ git+https://github.com/isaac-neutrons/data-assembler.git",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-xdist>=3.5",
  "ruff>=0.15",
  "pre-commit>=3.4",
  "pip-audit>=2.7",
]
docs = ["mkdocs-material>=9.5", "sphinx>=7.2", "myst-parser>=2.0"]
all = ["nr-workbench[nexus,isaac,dev,docs]"]

[project.urls]
Homepage = "https://github.com/neutrons-ai/aure-workbench"
Repository = "https://github.com/neutrons-ai/aure-workbench"
Issues = "https://github.com/neutrons-ai/aure-workbench/issues"

[project.scripts]
nr-workbench = "nr_workbench.cli:main"
nrw = "nr_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nr_workbench*"]

# Skills and templates are DATA, not modules -- they have no __init__.py, so
# `packages.find` will not carry them. Without these globs they vanish from the
# wheel and `nrw init` silently installs nothing. tests/test_packaging.py builds
# a wheel and asserts they are present.
#
# The dot-prefixed patterns are not redundant: `**/*` follows glob semantics, so
# it matches neither hidden files nor anything inside a hidden directory. Left
# to `templates/**/*` alone, the scaffold ships without .gitignore,
# .github/copilot-instructions.md and .vscode/settings.json -- an installed
# nr-workbench would then produce projects with no Copilot instructions and no
# editor schema wiring, while an editable install looked perfectly fine.
#
# Each hidden level needs its own pattern, and the harness subtrees put one a
# level deeper than the project tree does: `templates/project/.claude/` is
# reached by `templates/*/.*/...`, but `templates/harness/claude/.claude/` needs
# `templates/*/*/.*/...`. A new harness that nests deeper again needs another
# line -- tests/test_packaging.py enumerates the tree and will say so.
[tool.setuptools.package-data]
nr_workbench = [
  "py.typed",
  "skills/**/*",
  "skills/**/.*",
  "templates/**/*",
  "templates/**/.*",
  "templates/*/.*/**/*",
  "templates/*/.*/*",
  "templates/*/*/.*",
  "templates/*/*/.*/*",
  "templates/*/*/.*/**/*",
  "codegen/templates/*",
  "web/templates/*",
  "web/static/*",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Parallel by default. Measured on this suite: 176s serial -> 44s at -n 8,
# 40s at -n 16, and the remainder is one module's own setup, so more workers
# buy little. `--dist loadscope` keeps a module on one worker, which matters
# because the expensive fixtures are module-shaped -- splitting a module
# across workers would rebuild them per worker and give the time back.
#
# To debug, turn it off: `pytest -n0 -s tests/test_x.py::test_y`. Under xdist
# there is no stdout to attach to, so -s and pdb need -n0.
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-n",
  "auto",
  "--dist",
  "loadscope",
  "--cov=src/nr_workbench",
  "--cov-report=term-missing",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "needs_aure: requires the optional aure extra to be installed",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

# Ruff handles BOTH linting and formatting here (`ruff check` + `ruff format`).
# No black -- see .github/copilot-instructions.md, "Technology Stack Preferences".
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
  # The hand-written reference the model gate compares against. It is kept
  # verbatim on purpose: reformatting it would weaken the comparison and
  # obscure what the generator is being measured against.
  "tests/data/reference",
  # Markdown is prose, and the SKILL.md files are shipped data. Ruff 0.16
  # formats the Python inside Markdown code blocks, the pinned pre-commit ruff
  # does not, and `ruff format src` rewrote the shipped skills more than once.
  "*.md",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long (handled by the formatter)
  "B008", # function calls in argument defaults (click uses these)
  "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG", "S101"]
# The tNR modules hold numerics moved byte-for-byte from experiments-2025.
# Adding `strict=` to those zips would change behaviour -- raising instead of
# truncating -- in code the characterization tests pin exactly. Left alone
# deliberately; see docs/ground_truths.md.
"src/nr_workbench/tnr/ascii.py" = ["B905"]
"src/nr_workbench/tnr/plots.py" = ["B905"]
# ConstraintForm's classmethods define the interface subclasses implement; a
# form that does not need `constraint` or `context` still has to accept them.
"src/nr_workbench/spec/constraints.py" = ["ARG003"]

[tool.ruff.lint.isort]
known-first-party = ["nr_workbench"]
